<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --text:#1d2433; --muted:#667085; --border:#e3e7ee; --hover:#f0f4fa;
  --primary:#1f5fa8; --primary-soft:#e6eef8;
  --red:#c0352b; --red-soft:#fdecea; --amber:#a86400; --amber-soft:#fff4e0;
  --green:#1e7b45; --green-soft:#e5f5ec; --blue:#1f5fa8; --blue-soft:#e6eef8;
  --gray:#5b6474; --gray-soft:#eef0f4; --side:#14325a; --side-text:#dbe6f5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151c; --panel:#1a2029; --text:#e6e9ef; --muted:#98a2b3; --border:#2c3440; --hover:#222a35;
    --primary:#6aa3e8; --primary-soft:#1d2d44;
    --red:#f0857c; --red-soft:#3a1f1d; --amber:#f2b55c; --amber-soft:#3a2c14;
    --green:#6fcf97; --green-soft:#16301f; --blue:#6aa3e8; --blue-soft:#1d2d44;
    --gray:#aab3c2; --gray-soft:#262d38; --side:#0c1a2e; --side-text:#c8d6ea;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--primary)}
h1,h2,h3,h4{margin:0 0 8px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 9px;width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
label>input,label>select,label>textarea{margin-top:3px;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.w100{width:100%;justify-content:center}
.muted{color:var(--muted)} .small{font-size:12px} .right{text-align:right} .nowrap{white-space:nowrap}
.hidden{display:none!important}
.layout{display:flex;min-height:100vh}
.side{width:230px;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand b{display:block;font-size:15px;color:#fff}
.brand span{font-size:12px;opacity:.75}
.side nav{flex:1;padding:8px 0;overflow:auto}
.side nav a{display:flex;justify-content:space-between;padding:9px 16px;color:var(--side-text);text-decoration:none;border-left:3px solid transparent}
.side nav a:hover{background:rgba(255,255,255,.06)}
.side nav a.active{background:rgba(255,255,255,.1);border-left-color:#7fb2ee;color:#fff}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:12px}
.side-foot .btn{margin-top:8px;background:transparent;color:var(--side-text);border-color:rgba(255,255,255,.25)}
main{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.top h2{margin:0;font-size:18px}
.bell{position:relative;border:1px solid var(--border);background:var(--panel);border-radius:20px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.bell .cnt{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
#page{padding:20px 24px 60px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;border-top:3px solid var(--border)}
.kpi:hover{background:var(--hover)}
.kpi .v{font-size:22px;font-weight:600;margin:2px 0}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.red{border-top-color:var(--red)} .kpi.amber{border-top-color:var(--amber)} .kpi.green{border-top-color:var(--green)} .kpi.blue{border-top-color:var(--blue)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;min-width:140px}
.toolbar .grow{flex:1;min-width:200px}
.toolbar input[type=checkbox]{min-width:0}
.toolbar .sp{flex:1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--gray-soft);font-size:12px;font-weight:600;color:var(--muted);position:sticky;top:0;white-space:nowrap}
tbody tr:hover{background:var(--hover)}
tfoot td{font-weight:600;background:var(--gray-soft)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;white-space:nowrap;margin:1px 2px 1px 0}
.b-red{background:var(--red-soft);color:var(--red)} .b-amber{background:var(--amber-soft);color:var(--amber)}
.b-green{background:var(--green-soft);color:var(--green)} .b-blue{background:var(--blue-soft);color:var(--blue)}
.b-gray{background:var(--gray-soft);color:var(--gray)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.active{border-bottom-color:var(--primary);color:var(--text);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
.span2{grid-column:span 2} .span3{grid-column:span 3} .spanall{grid-column:1/-1}
.week{margin-bottom:18px}
.week-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--gray-soft);border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:0}
.week-h.now{background:var(--amber-soft)}
.week .tbl-wrap{border-radius:0 0 8px 8px}
.hint{background:var(--blue-soft);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.warn{background:var(--amber-soft)}
.err{background:var(--red-soft)}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal-box{background:var(--panel);border-radius:12px;width:100%;max-width:640px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal-box.wide{max-width:1100px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0}
.modal-head .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
#modal-body{padding:16px 18px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;max-width:380px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.error{background:var(--red);color:#fff}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{width:100%;max-width:380px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.ellip{max-width:340px;min-width:180px}
.clip{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-sum{font-variant-numeric:tabular-nums}
@media (max-width:900px){
  .layout{flex-direction:column}
  .side{width:100%;height:auto;position:static}
  .side nav{display:flex;overflow-x:auto;padding:0}
  .side nav a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  .side nav a.active{border-bottom-color:#7fb2ee}
  .side-foot{display:flex;justify-content:space-between;align-items:center}
  .side-foot .btn{margin:0}
  #page{padding:16px}
  .top{padding:12px 16px;position:static}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .span2,.span3{grid-column:auto}
}
@media print{
  .side,.top,.no-print,.toolbar,.tabs,#toasts,.modal{display:none!important}
  body,html{background:#fff;color:#000}
  #page{padding:0}
  .card,.tbl-wrap{border:0;padding:0}
  th{background:#eee!important;color:#000;position:static}
  .print-only{display:block!important}
  td,th{padding:4px 6px;font-size:11px}
}
.print-only{display:none}
</style>

<script>
'use strict';
/* ====================== CẤU HÌNH ======================
   Điền từ Supabase › Project Settings › API.
   Để trống thì app sẽ hỏi lúc mở và lưu trong trình duyệt. */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';
const BUCKET = 'ho-so';

/* ====================== HẰNG SỐ ====================== */
const DEPTS = {QLTS:'Quản lý tài sản', PHAP_LY:'Pháp lý', QLTN:'Quản lý tòa nhà', KY_THUAT:'Kỹ thuật'};
const ROLES = {ke_toan:'Kế toán', bo_phan:'Bộ phận', cho_cap_quyen:'Chờ cấp quyền'};
const GROUPS = ['CENTRAL','SOFITEL'];
const STATUS = {
  chua_den_han:['Chưa đến hạn','gray'], den_han_tuan_nay:['Đến hạn tuần này','amber'],
  qua_han:['Quá hạn','red'], mot_phan:['Thanh toán một phần','blue'], da_thanh_toan:['Đã thanh toán','green']};
const FLAGS = {
  qua_han:['Quá hạn','red'], thieu:['Thanh toán thiếu','red'], trung:['Trùng / trả thừa','red'],
  lech_gia:['Lệch giá','amber'], cho_so_tien:['Chờ số tiền','amber'], thieu_quy_tac:['Thiếu quy tắc hạn TT','amber'],
  sap_het_han:['HĐ sắp hết hạn','amber'], het_han:['HĐ đã hết hạn','gray'], khong_ky:['Không rõ kỳ phí','gray'],
  can_thu_cong:['Cần xử lý thủ công','gray']};
const APPROVAL = {cho_duyet:['Chờ duyệt','amber'], da_duyet:['Đã duyệt','green'], tu_choi:['Từ chối','red']};
const MATCH = {chua_doi_chieu:['Chưa đối chiếu','red'], goi_y:['Gợi ý','amber'], da_doi_chieu:['Đã đối chiếu','green'], bo_qua:['Không thuộc lịch TT','gray']};
const METHOD = {tu_dong:'Tự động', goi_y:'Theo gợi ý', thu_cong:'Thủ công'};
const BUCKETS = [['chua_den_han','Chưa đến hạn'],['b30','0–30 ngày'],['b60','31–60 ngày'],['b90','61–90 ngày'],['b90p','> 90 ngày']];

/* ====================== TRẠNG THÁI ====================== */
let sb = null, me = null, settings = {tolerance_pct:2, schedule_start:'2026-01', horizon_months:2};
let suppliers = new Map();
const cache = {sched:new Map(), lines:new Map(), reqs:new Map(), pays:new Map()};
const isKT = () => me && me.role === 'ke_toan';
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];

/* ====================== TIỆN ÍCH ====================== */
const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const toNum = v => v == null || v === '' ? null : Number(v);
function vnd(n){ return n == null || isNaN(n) ? '—' : Math.round(Number(n)).toLocaleString('vi-VN') + ' ₫'; }
function num(n){ return n == null || isNaN(n) ? '' : Math.round(Number(n)).toLocaleString('vi-VN'); }
function fdate(d){ if(!d) return ''; const s = String(d).slice(0,10).split('-'); return s.length === 3 ? `${s[2]}/${s[1]}/${s[0]}` : d; }
function fdt(d){ if(!d) return ''; const x = new Date(d); return `${pad(x.getDate())}/${pad(x.getMonth()+1)}/${x.getFullYear()} ${pad(x.getHours())}:${pad(x.getMinutes())}`; }
function fper(p){ return p ? `${p.slice(5,7)}/${p.slice(0,4)}` : ''; }
function isoOf(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayISO(){ return isoOf(new Date()); }
function addDays(iso, k){ const [y,m,d] = iso.split('-').map(Number); return isoOf(new Date(y, m-1, d+k)); }
function diffDays(a, b){ const [y1,m1,d1]=a.split('-').map(Number), [y2,m2,d2]=b.split('-').map(Number); return Math.round((Date.UTC(y1,m1-1,d1)-Date.UTC(y2,m2-1,d2))/86400000); }
function monthAdd(ym, k){ let [y,m] = ym.split('-').map(Number); m += k; y += Math.floor((m-1)/12); m = ((m-1)%12+12)%12+1; return `${y}-${pad(m)}`; }
function lastDay(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function calcDue(feeYm, day, off){ const ym = monthAdd(feeYm, off||0); return `${ym}-${pad(Math.min(day, lastDay(ym)))}`; }
function weekOf(iso){ const d = Number(iso.slice(8,10)); return d<=7?1:d<=14?2:d<=21?3:4; }
function weekRange(ym, w){ const s = (w-1)*7+1, e = w===4 ? lastDay(ym) : w*7; return [`${ym}-${pad(s)}`, `${ym}-${pad(e)}`]; }
function norm(s){ return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\s+/g,' ').trim(); }
function badge(map, key){ const v = map[key] || [key,'gray']; return `<span class="badge b-${v[1]}">${esc(v[0])}</span>`; }
function flagsHtml(fl){ return (fl||[]).map(f => badge(FLAGS, f)).join(''); }
function deptName(d){ return d ? (DEPTS[d] || d) : ''; }
function supName(ma){ const s = suppliers.get(ma); return s ? (s.ten_ncc || ma) : (ma || ''); }
function sum(arr, f){ return arr.reduce((a, x) => a + (Number(f(x)) || 0), 0); }
function debounce(fn, ms=250){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function toast(msg, type){ const el = document.createElement('div'); el.className = 'toast ' + (type||''); el.textContent = msg; $('#toasts').append(el); setTimeout(() => el.remove(), type==='error' ? 7000 : 3500); }
function showErr(e){ console.error(e); toast('Lỗi: ' + (e?.message || e), 'error'); }
function openModal(title, html, wide){ $('#modal-title').textContent = title; $('#modal-body').innerHTML = html; $('#modal-box').classList.toggle('wide', !!wide); $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); $('#modal-body').innerHTML = ''; }
function chunk(a, n){ const r = []; for(let i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; }
function match(q, ...fields){ if(!q) return true; const n = norm(q); return fields.some(f => norm(f).includes(n)); }
function opts(map, sel, empty){ return (empty!=null ? `<option value="">${esc(empty)}</option>` : '') + Object.entries(map).map(([k,v]) => `<option value="${esc(k)}" ${k===sel?'selected':''}>${esc(Array.isArray(v)?v[0]:v)}</option>`).join(''); }
function grpOpts(sel, empty){ return (empty!=null?`<option value="">${esc(empty)}</option>`:'') + GROUPS.map(g => `<option ${g===sel?'selected':''}>${g}</option>`).join(''); }
function must(res){ if(res.error) throw res.error; return res.data; }

async function fetchAll(build){
  const out = []; let from = 0;
  for(;;){
    const {data, error} = await build().range(from, from + 999);
    if(error) throw error;
    out.push(...data);
    if(data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function fetchIn(table, cols, field, values){
  const out = [];
  for(const c of chunk([...new Set(values)], 100)) out.push(...await fetchAll(() => sb.from(table).select(cols).in(field, c).order('id')));
  return out;
}

/* ---------- Excel ---------- */
function cellDate(v){
  if(v == null || v === '') return null;
  if(typeof v === 'number'){ const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : null; }
  if(v instanceof Date) return isoOf(v);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/); if(m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function cellNum(v){
  if(v == null || v === '') return null;
  if(typeof v === 'number') return v;
  let s = String(v).replace(/[\s₫đ]/g,'');
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g,'');
  else s = s.replace(',','.');
  const n = Number(s); return isNaN(n) ? null : n;
}
function cellStr(v){ return v == null ? null : (String(v).trim() || null); }
async function readSheet(file, mustHave){
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
  for(const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
    const hi = rows.findIndex(r => r.some(c => norm(c) === mustHave));
    if(hi >= 0){
      const head = rows[hi].map(norm);
      const data = rows.slice(hi+1).filter(r => r.some(c => c != null && String(c).trim() !== ''));
      return {head, data, col: (...names) => { for(const n of names){ const i = head.indexOf(n); if(i >= 0) return i; } return -1; }};
    }
  }
  throw new Error(`Không tìm thấy dòng tiêu đề có cột "${mustHave}" trong file.`);
}
function exportXlsx(filename, sheets){
  const wb = XLSX.utils.book_new();
  for(const [name, rows, title] of sheets){
    const ws = XLSX.utils.aoa_to_sheet(title ? [[title],[]] : []);
    XLSX.utils.sheet_add_json(ws, rows.length ? rows : [{'Không có dữ liệu':''}], {origin: title ? 'A3' : 'A1'});
    const keys = Object.keys(rows[0] || {});
    ws['!cols'] = keys.map(k => ({wch: Math.min(60, Math.max(k.length, ...rows.slice(0,200).map(r => String(r[k] ?? '').length)) + 2)}));
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  }
  XLSX.writeFile(wb, filename);
}
const TEMPLATES = {
  ncc: ['DANH SÁCH NHÀ CUNG CẤP', ['Nhóm','Mã NCC','Tên NCC','Hợp đồng số','Loại thanh toán','Phụ lục hợp đồng','Ngày bắt đầu','Ngày kết thúc','Hạn TT hàng tháng','Nội dung','Sắp xếp lịch thanh toán','ĐVT','SL','Đơn giá','Thành tiền','Thuế suất','Tiền thuế','Tổng tiền','Bộ phận','Chu kỳ (tháng)','Ngày hạn TT','Lệch tháng'],

/* ---------- Phân tích diễn giải ---------- */
function parsePeriods(text){
  const t = String(text || '').normalize('NFC'), out = new Set();
  const re = /(?<![\d.])(20\d{2}|\d{2})\.(\d{2})((?:\s*\+\s*\d{2})*)(?!\d)/g;
  let m;
  while((m = re.exec(t))){
    let y = m[1].length === 2 ? 2000 + Number(m[1]) : Number(m[1]);
    if(m[1].length === 2 && (y < 2020 || y > 2039)) continue;
    let mo = Number(m[2]); if(mo < 1 || mo > 12) continue;
    out.add(`${y}-${pad(mo)}`);
    let prev = mo;
    for(const x of (m[3].match(/\d{2}/g) || [])){
      const k = Number(x); if(k < 1 || k > 12) continue;
      if(k < prev) y++;
      out.add(`${y}-${pad(k)}`); prev = k;
    }
  }
  const re2 = /(?:th[aá]ng|\bT)\s*(\d{1,2})\s*[\/.\-]\s*(20\d{2})/gi;
  while((m = re2.exec(t))){ const mo = Number(m[1]); if(mo >= 1 && mo <= 12) out.add(`${m[2]}-${pad(mo)}`); }
  return [...out].sort();
}
function normInv(s){ return String(s).toUpperCase().replace(/^0+(?=\d)/,''); }
function parseInvoices(text){
  const t = String(text || '').normalize('NFC'), out = new Set();
  const re = /h[oó]a\s*đ[oơ]n\s*(?:s[oố]\s*)?:?\s*([A-Za-z0-9\-]+(?:\s*[;,&]\s*[A-Za-z0-9\-]+)*)/gi;
  let m;
  while((m = re.exec(t))) m[1].split(/[;,&]/).map(s => s.trim()).filter(s => /\d/.test(s)).forEach(s => out.add(normInv(s)));
  const re2 = /\bINV\s*[-#.]?\s*(\d+)/gi;
  while((m = re2.exec(t))) out.add(normInv(m[1]));
  return [...out];
}
function prefillRule(lich, dvt){
  const n = norm(lich); let day = null, off = 0, chu = 1;
  const w = n.match(/tuan\s*(\d)/); if(w) day = ({1:7, 2:14, 3:21, 4:28})[w[1]] || null;
  if(/thang sau/.test(n)) off = 1;
  if(/quy/.test(n)){ chu = 3; off = 3; }
  if(dvt === 'Năm') chu = 12;
  return {due_day: day, due_month_offset: off, chu_ky: chu};
}
function ruleText(l){
  if(!l.due_day) return '<span class="muted">Chưa có</span>';
  const off = l.due_month_offset;
  return `Ngày ${l.due_day}, ${off === 0 ? 'cùng tháng phí' : off === 1 ? 'tháng sau' : `+${off} tháng`}`;
}
function cycleText(c){ return ({1:'Tháng', 2:'2 tháng', 3:'Quý', 6:'6 tháng', 12:'Năm'})[c] || c + ' tháng'; }

async function uploadPdf(file, kind, dept){
  if(!file) return null;
  if(!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) throw new Error('Chỉ chấp nhận file PDF.');
  if(file.size > 20 * 1024 * 1024) throw new Error('File PDF tối đa 20 MB.');

  return path;
}

async function boot(){
  const cfg = getCfg();
  if(!cfg || !window.supabase){ return renderConfig(); }
  sb = window.supabase.createClient(cfg.url, cfg.key);
  window.addEventListener('hashchange', () => { if(me) route(); });
  // không gọi API Supabase trực tiếp trong callback (tránh khóa phiên) -> setTimeout
  sb.auth.onAuthStateChange((ev, session) => setTimeout(async () => {
    if(ev === 'PASSWORD_RECOVERY'){
      const pw = prompt('Nhập mật khẩu mới (tối thiểu 6 ký tự):');
      if(pw){ try{ must(await sb.auth.updateUser({password:pw})); toast('Đã đổi mật khẩu.'); }catch(e){ showErr(e); } }
    }
    if(ev === 'SIGNED_IN' && session) startApp(session);
    if(ev === 'SIGNED_OUT'){ me = null; started = false; renderLogin(); }
  }, 0));
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return renderLogin();
  startApp(session);
}

    if(r.flags.includes('thieu') || r.flags.includes('trung')) a.push(`<button class="btn sm" data-sa="accept" data-id="${r.id}" title="Ghi nhận số đã trả là số phải trả (lệch giá)">Chấp nhận lệch</button>`);
  }
  return a.join(' ');
}

async function pageDashboard(){
  const rows = await loadSchedule();
  const today = todayISO(), ym = today.slice(0,7);
  const week = rows.filter(r => r.status === 'den_han_tuan_nay');
  const over = rows.filter(r => r.flags.includes('qua_han'));
  const waitAmt = rows.filter(r => r.flags.includes('cho_so_tien') && r.due_date <= addDays(today, 14));
  const warn = rows.filter(r => r.flags.some(f => ['trung','thieu','lech_gia'].includes(f)));
  const month = rows.filter(r => r.due_date.slice(0,7) === ym);
  const [ws, we] = weekRange(ym, weekOf(today));
  let extra = '';
  if(isKT()){
    const c = async (t, f) => (await f(sb.from(t).select('id', {count:'exact', head:true}))).count || 0;
    const [pl, pr, pu, pg, nr, ex] = await Promise.all([
      c('contract_lines', q => q.eq('approval_status','cho_duyet')),
      c('payment_requests', q => q.eq('status','cho_duyet')),
      c('payments', q => q.eq('match_status','chua_doi_chieu')),
      c('payments', q => q.eq('match_status','goi_y')),
      c('v_contract_lines', q => q.contains('flags', ['thieu_quy_tac']).eq('active', true)),
      c('v_contract_lines', q => q.contains('flags', ['sap_het_han']).eq('active', true))]);
    extra = `
      <div class="kpi amber" onclick="location.hash='#ncc'"><div class="s">Hợp đồng chờ duyệt</div><div class="v">${pl}</div><div class="s">Yêu cầu TT chờ duyệt: ${pr}</div></div>
      <div class="kpi red" onclick="location.hash='#doichieu'"><div class="s">Chứng từ chưa đối chiếu</div><div class="v">${pu}</div><div class="s">Gợi ý chờ xác nhận: ${pg}</div></div>
      <div class="kpi amber" onclick="location.hash='#ncc?f=thieu_quy_tac'"><div class="s">Dòng HĐ thiếu quy tắc hạn TT</div><div class="v">${nr}</div><div class="s">Chưa sinh lịch thanh toán</div></div>
      <div class="kpi amber" onclick="location.hash='#ncc?f=sap_het_han'"><div class="s">HĐ hết hạn trong 30 ngày</div><div class="v">${ex}</div><div class="s">Cần gia hạn / cập nhật</div></div>`;
  }
  const grp = GROUPS.map(g => { const x = month.filter(r => r.nhom === g); return `<tr><td><b>${g}</b></td><td class="num">${x.length}</td><td class="num">${num(sum(x, r=>r.expected_amount))}</td><td class="num">${num(sum(x, r=>r.paid_amount))}</td><td class="num">${num(sum(x, r=>r.remaining))}</td><td class="num">${x.filter(r=>r.status==='da_thanh_toan').length}/${x.length}</td></tr>`; }).join('');
  $('#page').innerHTML = `
    <div class="kpis">
      <div class="kpi amber" onclick="location.hash='#lich'"><div class="s">Đến hạn tuần này (${fdate(ws).slice(0,5)}–${fdate(we).slice(0,5)})</div><div class="v">${week.length}</div><div class="s">${vnd(sum(week, r=>r.remaining))}</div></div>
      <div class="kpi red" onclick="document.getElementById('d-over').scrollIntoView()"><div class="s">Quá hạn</div><div class="v">${over.length}</div><div class="s">${vnd(sum(over, r=>r.remaining))}</div></div>
      <div class="kpi blue" onclick="document.getElementById('d-wait').scrollIntoView()"><div class="s">Chờ số tiền (không cố định)</div><div class="v">${waitAmt.length}</div><div class="s">Đến hạn trong 14 ngày</div></div>
      <div class="kpi green" onclick="location.hash='#lich'"><div class="s">Đã thanh toán – hạn tháng ${fper(ym)}</div><div class="v">${month.filter(r=>r.status==='da_thanh_toan').length}/${month.length}</div><div class="s">${vnd(sum(month, r=>r.paid_amount))}</div></div>
      ${extra}
    </div>
    <div class="card"><h3>Tổng hợp theo nhóm – các khoản có hạn TT trong tháng ${fper(ym)}</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Nhóm</th><th class="num">Số khoản</th><th class="num">Phải trả</th><th class="num">Đã trả</th><th class="num">Còn lại</th><th class="num">Hoàn tất</th></tr></thead><tbody>${grp}</tbody></table></div></div>
    <div class="card"><h3>Cần thanh toán tuần này</h3>${schedTable(week, {empty:'Không có khoản đến hạn trong tuần này.'})}</div>
    <div class="card" id="d-over"><h3>Quá hạn</h3>${schedTable(over, {empty:'Không có khoản quá hạn.'})}</div>
    <div class="card" id="d-wait"><h3>Chờ nhập số tiền (dòng không cố định, hạn trong 14 ngày)</h3>${schedTable(waitAmt, {empty:'Không có.'})}</div>
    <div class="card"><h3>Cảnh báo: trùng / thiếu / lệch giá</h3>${schedTable(warn, {empty:'Không có cảnh báo.'})}</div>`;
}

const lichState = {month: todayISO().slice(0,7), nhom:'', dept:'', status:'', q:''};
async function pageLich(){
  const s = lichState;
  $('#page').innerHTML = `
    <div class="toolbar">
      <button class="btn" id="l-prev">‹</button><input type="month" id="l-month" value="${s.month}" style="min-width:160px"><button class="btn" id="l-next">›</button>
      <select id="l-nhom">${grpOpts(s.nhom, 'Tất cả nhóm')}</select>
      ${isKT() ? `<select id="l-dept">${opts(DEPTS, s.dept, 'Tất cả bộ phận')}</select>` : ''}
      <select id="l-status">${opts(STATUS, s.status, 'Tất cả trạng thái')}</select>
      <input class="grow" id="l-q" placeholder="Tìm NCC, nội dung, số HĐ…" value="${esc(s.q)}">
      <button class="btn" id="l-xls">Xuất Excel</button><button class="btn" onclick="window.print()">In / PDF</button>
    </div>
    <div class="print-only"><h2>LỊCH THANH TOÁN NHÀ CUNG CẤP – THÁNG ${fper(s.month)}</h2></div>
    <div id="l-body"><div class="loading">Đang tải…</div></div>`;
  const reload = () => { s.month = $('#l-month').value || s.month; pageLich(); };
  $('#l-month').onchange = reload;
  $('#l-prev').onclick = () => { $('#l-month').value = monthAdd(s.month, -1); reload(); };
  $('#l-next').onclick = () => { $('#l-month').value = monthAdd(s.month, 1); reload(); };
  const start = `${s.month}-01`, end = `${s.month}-${pad(lastDay(s.month))}`;
  const rows = await loadSchedule(q => q.lte('due_date', end).or(`due_date.gte.${start},status.neq.da_thanh_toan`));
  const draw = () => {
    s.nhom = $('#l-nhom').value; s.dept = $('#l-dept')?.value || ''; s.status = $('#l-status').value; s.q = $('#l-q').value;
    const f = rows.filter(r => (r.due_date >= start || r.status !== 'da_thanh_toan') && (!s.nhom || r.nhom === s.nhom) && (!s.dept || r.department === s.dept) && (!s.status || r.status === s.status)
      && match(s.q, r.ma_ncc, r.ten_ncc, r.noi_dung, r.so_hop_dong, r.invoice_no));
    const carry = f.filter(r => r.due_date < start && r.status !== 'da_thanh_toan');
    const today = todayISO();
    let html = '';
    if(carry.length) html += `<div class="week"><div class="week-h" style="background:var(--red-soft)"><b>Còn tồn từ các tháng trước</b><span class="pill-sum">${carry.length} khoản · còn lại ${vnd(sum(carry, r=>r.remaining))}</span></div>${schedTable(carry)}</div>`;
    for(let w = 1; w <= 4; w++){
      const [a, b] = weekRange(s.month, w);
      const x = f.filter(r => r.due_date >= a && r.due_date <= b);
      const now = today >= a && today <= b;
      html += `<div class="week"><div class="week-h ${now ? 'now' : ''}"><b>Tuần ${w} (${fdate(a).slice(0,5)} – ${fdate(b).slice(0,5)})${now ? ' · tuần này' : ''}</b>
        <span class="pill-sum">${x.length} khoản · phải trả ${vnd(sum(x, r=>r.expected_amount))} · còn lại ${vnd(sum(x, r=>r.remaining))}</span></div>${schedTable(x, {empty:'Không có khoản nào.'})}</div>`;
    }
    $('#l-body').innerHTML = html;
    $('#l-xls').onclick = () => exportXlsx(`Lich_thanh_toan_${s.month}.xlsx`, [['Lich TT', f.map(r => ({
      'Tuần': r.due_date < start ? 'Tồn trước' : 'Tuần ' + r.week_no, 'Hạn TT': fdate(r.due_date), 'Nhóm': r.nhom, 'Mã NCC': r.ma_ncc, 'Tên NCC': r.ten_ncc,
      'Nội dung': r.noi_dung, 'Số HĐ': r.so_hop_dong, 'Kỳ phí': fper(r.fee_period), 'Phải trả': r.expected_amount, 'Đã trả': r.paid_amount, 'Còn lại': r.remaining,
      'Ngày TT': fdate(r.last_paid_date), 'Trạng thái': STATUS[r.status][0], 'Cảnh báo': r.flags.map(x => FLAGS[x]?.[0] || x).join(', '), 'Bộ phận': deptName(r.department)})),
      `LỊCH THANH TOÁN NHÀ CUNG CẤP – THÁNG ${fper(s.month)}`]]);
  };
  ['#l-nhom','#l-dept','#l-status'].forEach(id => { const el = $(id); if(el) el.onchange = draw; });
  $('#l-q').oninput = debounce(draw);
  draw();
}

async function importNcc(file){
  const res = $('#n-res'); res.innerHTML = '<div class="hint">Đang đọc file…</div>';
  try{
    const S = await readSheet(file, 'ma ncc');
    const C = {nhom:S.col('nhom'), ma:S.col('ma ncc'), ten:S.col('ten ncc'), hd:S.col('hop dong so','so hop dong'), loai:S.col('loai thanh toan'), pl:S.col('phu luc hop dong','phu luc'),
      bd:S.col('ngay bat dau'), kt:S.col('ngay ket thuc'), han:S.col('han tt hang thang'), nd:S.col('noi dung'), lich:S.col('sap xep lich thanh toan'), dvt:S.col('dvt'),
      sl:S.col('sl'), dg:S.col('don gia'), tt:S.col('thanh tien'), ts:S.col('thue suat'), tth:S.col('tien thue'), tong:S.col('tong tien'),
      bp:S.col('bo phan'), ck:S.col('chu ky (thang)','chu ky'), nh:S.col('ngay han tt'), lt:S.col('lech thang')};
    const get = (r, k) => C[k] >= 0 ? r[C[k]] : null;
    const supRows = new Map(), lines = [], seen = {}; let skipped = 0;
    const deptOf = v => { const n = norm(v); if(!n) return null; const k = Object.keys(DEPTS).find(k => norm(k) === n || norm(DEPTS[k]) === n); return k || null; };
    for(const r of S.data){
      const ma = cellStr(get(r,'ma')); if(!ma){ skipped++; continue; }
      const MA = ma.toUpperCase(); const ten = cellStr(get(r,'ten'));
      if(!supRows.has(MA) || ten) supRows.set(MA, ten);
      const dgRaw = get(r,'dg'); const isVar = norm(dgRaw).includes('khong co dinh');
      const dvt = norm(get(r,'dvt')) === 'nam' ? 'Năm' : 'Tháng';
      let ts = cellNum(String(get(r,'ts') ?? '').replace('%','')); if(ts != null && ts >= 1) ts = ts / 100;
      const sl = cellNum(get(r,'sl')) ?? 1, dg = isVar ? null : cellNum(dgRaw);
      let tt = cellNum(get(r,'tt')), tong = cellNum(get(r,'tong'));
      if(!isVar && tt == null && dg != null) tt = sl * dg;
      if(!isVar && tong == null && tt != null) tong = Math.round(tt * (1 + (ts || 0)) * 100) / 100;
      const nhomRaw = String(get(r,'nhom') || '').trim().toUpperCase();
      const lich = cellStr(get(r,'lich'));
      const pre = prefillRule(lich, dvt);
      const nh = cellNum(get(r,'nh')), lt = cellNum(get(r,'lt')), ck = cellNum(get(r,'ck'));
      const row = {nhom: GROUPS.includes(nhomRaw) ? nhomRaw : 'CENTRAL', ma_ncc:MA, so_hop_dong:cellStr(get(r,'hd')), loai_tt:cellStr(get(r,'loai')), phu_luc:cellStr(get(r,'pl')),
        ngay_bat_dau:cellDate(get(r,'bd')), ngay_ket_thuc:cellDate(get(r,'kt')), han_tt_text:cellStr(get(r,'han')), noi_dung:cellStr(get(r,'nd')), lich_tt:lich,
        dvt, sl, don_gia:dg, thanh_tien:isVar ? null : tt, thue_suat:ts ?? 0, tien_thue:isVar ? null : cellNum(get(r,'tth')), tong_tien:isVar ? null : tong, is_variable:isVar,
        department:deptOf(get(r,'bp')), chu_ky:[1,2,3,6,12].includes(ck) ? ck : pre.chu_ky,
        due_day: nh >= 1 && nh <= 31 ? nh : pre.due_day, due_month_offset: lt != null && lt >= 0 && lt <= 12 ? lt : pre.due_month_offset};
      let key = [row.nhom, MA, row.so_hop_dong, row.phu_luc, row.noi_dung, row.ngay_bat_dau, isVar ? 'VAR' : dg, dvt, sl].map(x => norm(x ?? '')).join('|');
      seen[key] = (seen[key] || 0) + 1; if(seen[key] > 1) key += '#' + seen[key];
      row.import_key = key; lines.push(row);
    }
    // NCC
    const newSup = [...supRows].filter(([ma]) => !suppliers.has(ma)).map(([ma, ten]) => ({ma_ncc:ma, ten_ncc:ten || ma}));
    const updSup = [...supRows].filter(([ma, ten]) => suppliers.has(ma) && ten && ten !== suppliers.get(ma).ten_ncc);
    if(newSup.length) must(await sb.from('suppliers').insert(newSup));
    for(const [ma, ten] of updSup) must(await sb.from('suppliers').update({ten_ncc:ten}).eq('ma_ncc', ma));
    // Dòng HĐ
    const existing = await fetchIn('contract_lines', 'id,import_key', 'import_key', lines.map(l => l.import_key));
    const exMap = new Map(existing.map(x => [x.import_key, x.id]));
    const ins = lines.filter(l => !exMap.has(l.import_key)).map(l => ({...l, due_rule_confirmed:false, approval_status:'da_duyet', approved_by:me.id, approved_at:new Date().toISOString()}));
    const upd = lines.filter(l => exMap.has(l.import_key));
    for(const c of chunk(ins, 200)) must(await sb.from('contract_lines').insert(c));
    for(const l of upd){ const {due_day, due_month_offset, chu_ky, department, ...rest} = l; must(await sb.from('contract_lines').update(department ? {...rest, department} : rest).eq('id', exMap.get(l.import_key))); }
    await loadSuppliers();
    nccState.flag = 'thieu_quy_tac';
    await pageNcc();
    $('#n-res').innerHTML = `<div class="hint">Import xong: <b>${newSup.length}</b> NCC mới, <b>${ins.length}</b> dòng HĐ mới, <b>${upd.length}</b> dòng cập nhật${skipped ? `, bỏ qua ${skipped} dòng không có Mã NCC` : ''}.<br>
      Quy tắc hạn TT đã được điền sẵn từ cột "Sắp xếp lịch thanh toán" (Tuần 1→ngày 7, Tuần 2→14, Tuần 3→21, Tuần 4→28, "tháng sau"→tháng sau, "Quý"→chu kỳ quý). <b>Kiểm tra và bấm "Xác nhận quy tắc đã chọn"</b> để sinh lịch. Danh sách bên dưới đang lọc các dòng chưa xác nhận.</div>`;
  }catch(e){ res.innerHTML = `<div class="hint err">${esc(e.message || e)}</div>`; showErr(e); }
}

async function importPayments(file, forced){
  const el = $('#d-res'); el.innerHTML = '<div class="hint">Đang đọc file…</div>';
  try{
    const S = await readSheet(file, 'so chung tu');
    const type = forced || (S.col('so tai khoan nh', 'ngay chung tu') >= 0 ? 'UNC' : 'PC');
    const C = {nht:S.col('ngay hach toan'), nct:S.col('ngay chung tu'), sct:S.col('so chung tu'), dg:S.col('dien giai'), st:S.col('so tien'), ma:S.col('ma doi tuong'),
      dt:S.col('doi tuong'), tk:S.col('so tai khoan nh'), ld:S.col('ly do thu/chi','ly do'), lct:S.col('loai chung tu'), gop:S.col('hach toan gop nhieu hoa don')};
    const get = (r, k) => C[k] >= 0 ? r[C[k]] : null;
    let emptyCode = 0, notSup = 0, dupFile = 0, bad = 0; const rows = [], seen = new Set(), notSupCodes = new Set();
    for(const r of S.data){
      const so = cellStr(get(r,'sct')); if(!so) continue;
      const ma = (cellStr(get(r,'ma')) || '').toUpperCase();
      if(!ma){ emptyCode++; continue; }
      if(!suppliers.has(ma)){ notSup++; notSupCodes.add(ma); continue; }
      if(seen.has(so)){ dupFile++; continue; } seen.add(so);
      const nht = cellDate(get(r,'nht')), tien = cellNum(get(r,'st'));
      if(!nht || tien == null){ bad++; continue; }
      const dg = cellStr(get(r,'dg'));
      rows.push({loai: /^PC/i.test(so) ? 'PC' : /^UNC/i.test(so) ? 'UNC' : type, so_chung_tu:so, ngay_hach_toan:nht, ngay_chung_tu:cellDate(get(r,'nct')), dien_giai:dg,
        so_tien:tien, ma_doi_tuong:ma, doi_tuong:cellStr(get(r,'dt')), so_tk_nh:cellStr(get(r,'tk')), ly_do:cellStr(get(r,'ld')), loai_chung_tu:cellStr(get(r,'lct')),
        hach_toan_gop:cellStr(get(r,'gop')), parsed_periods:parsePeriods(dg), parsed_invoice_nos:parseInvoices(dg)});
    }
    const exist = new Set((await fetchIn('payments', 'id,so_chung_tu', 'so_chung_tu', rows.map(r => r.so_chung_tu))).map(x => x.so_chung_tu));
    const ins = rows.filter(r => !exist.has(r.so_chung_tu));
    for(const c of chunk(ins, 200)) must(await sb.from('payments').insert(c));
    const importMsg = `Import ${type}: <b>${ins.length}</b> chứng từ mới; bỏ qua ${exist.size + dupFile} trùng số chứng từ, ${emptyCode} dòng trống Mã đối tượng, ${notSup} dòng không phải NCC${notSupCodes.size ? ` <span class="muted">(${esc([...notSupCodes].slice(0,15).join(', '))}${notSupCodes.size > 15 ? '…' : ''})</span>` : ''}${bad ? `, ${bad} dòng thiếu ngày/số tiền` : ''}.`;
    const r = await runAutoMatch(); r.importMsg = importMsg;
    dcState._last = r; dcState.tab = 'chua_doi_chieu';
    await pageDoiChieu();
  }catch(e){ el.innerHTML = `<div class="hint err">${esc(e.message || e)}</div>`; showErr(e); }
}

/* ---------- Thuật toán đối chiếu ----------
   1. Mã đối tượng = Mã NCC.
   2. Ứng viên = các kỳ còn nợ của NCC thuộc kỳ phí đọc từ diễn giải (cả 2 nhóm, nhiều kỳ) + yêu cầu TT từng lần còn nợ.
   3. Tổ hợp ứng viên có tổng = số tiền → tự động khớp; lệch trong ±tolerance% → gợi ý; còn lại → thủ công.
   4. Kỳ đã trả đủ mà trả tiếp, hoặc trùng số hóa đơn → cờ "nghi trùng" (không tự khớp). */
function covers(it, p){ for(let i = 0; i < (it.period_months || 1); i++) if(monthAdd(it.fee_period, i) === p) return true; return false; }
function bestSubset(items, amt){
  const n = Math.min(items.length, 16), rem = items.map(i => i._rem);
  let exact = null, near = null;
  for(let mask = 1; mask < (1 << n); mask++){

async function runAutoMatch(){
  const tol = (Number(settings.tolerance_pct) || 2) / 100;
  const pays = (await fetchAll(() => sb.from('payments').select('*').eq('match_status', 'chua_doi_chieu').order('ngay_hach_toan').order('id'))).filter(p => !p.flags.includes('can_thu_cong'));
  const res = {auto:0, sug:0, manual:0, dup:0};
  if(!pays.length) return res;
  const nccs = [...new Set(pays.map(p => p.ma_doi_tuong))];
  const items = await fetchIn('payment_schedule', '*', 'ma_ncc', nccs);
  const others = await fetchIn('payments', 'id,ma_doi_tuong,parsed_invoice_nos,match_status', 'ma_doi_tuong', nccs);
  items.forEach(i => { i._paid = Number(i.paid_amount); i._exp = i.expected_amount == null ? null : Number(i.expected_amount); });
  const closed = i => i._exp == null ? i._paid > 0 : i._paid >= i._exp - 1;
  const remOf = i => i._exp == null ? 0 : Math.max(0, i._exp - i._paid);
  for(const p of pays){
    const amt = Number(p.so_tien), flags = new Set(p.flags.filter(f => !['trung','lech_gia','khong_ky'].includes(f)));
    const sup = items.filter(i => i.ma_ncc === p.ma_doi_tuong);
    const invs = p.parsed_invoice_nos || [], periods = p.parsed_periods || [];
    if(invs.length && others.some(q => q.id !== p.id && q.ma_doi_tuong === p.ma_doi_tuong && q.match_status !== 'bo_qua' && (q.parsed_invoice_nos || []).some(x => invs.includes(x)))) flags.add('trung');
    let cands;
    if(periods.length){
      const inPer = sup.filter(i => i.contract_line_id && periods.some(pp => covers(i, pp)));
      if(inPer.length && inPer.every(closed)) flags.add('trung');
      cands = inPer.filter(i => !closed(i));
    } else {
      flags.add('khong_ky');
      cands = sup.filter(i => i.contract_line_id && !closed(i) && i.due_date <= addDays(p.ngay_hach_toan, 45));
    }
    const reqItems = sup.filter(i => i.request_id && !closed(i));
    const invHit = reqItems.filter(i => i.invoice_no && invs.includes(normInv(i.invoice_no)));
    cands = [...invHit, ...cands, ...reqItems.filter(i => !invHit.includes(i))];
    cands.sort((a, b) => (invHit.includes(b) - invHit.includes(a)) || a.due_date.localeCompare(b.due_date));
    cands.forEach(i => i._rem = remOf(i));
    const fixed = cands.filter(i => i._exp != null), vars = cands.filter(i => i._exp == null && i._paid === 0 && i.contract_line_id);
    const best = bestSubset(fixed, amt);
    let alloc = null, status = 'chua_doi_chieu', suggestion = null, setExp = [];
    const blocked = flags.has('trung') || flags.has('khong_ky');
    if(best.exact && !blocked){ alloc = allocate(best.exact, amt); status = 'da_doi_chieu'; }
    else if(!best.exact && vars.length && periods.length && !flags.has('trung')){ alloc = [{id:vars[0].id, amount:amt}]; setExp = [vars[0]]; status = 'da_doi_chieu'; }
    else if(best.exact){ suggestion = {items:allocate(best.exact, amt), diff:0}; status = 'goi_y'; }
    else if(best.near && best.near.sum > 0 && Math.abs(best.near.diff) <= tol * best.near.sum){ suggestion = {items:allocate(best.near.set, amt), diff:best.near.diff}; flags.add('lech_gia'); status = 'goi_y'; }
    if(alloc){
      for(const v of setExp){ must(await sb.from('payment_schedule').update({expected_amount:amt}).eq('id', v.id)); v._exp = amt; }
      must(await sb.from('payment_matches').insert(alloc.map(a => ({payment_id:p.id, schedule_id:a.id, amount:a.amount}))));
      alloc.forEach(a => { const it = items.find(i => i.id === a.id); it._paid += a.amount; });

}

  const st = must(await sb.from('app_settings').select('*').order('key'));
  $('#page').innerHTML = `
    <div class="hint">Tạo tài khoản: người dùng tự "Đăng ký" ở màn hình đăng nhập, hoặc quản trị viên thêm ở Supabase › Authentication › Users. Sau đó phân quyền tại đây.
      <br>Kế toán: toàn quyền. Bộ phận: thêm hợp đồng, yêu cầu thanh toán, nhập số tiền dòng không cố định; chỉ xem dữ liệu của bộ phận mình.</div>
    <div class="card"><h3>Người dùng</h3><div class="tbl-wrap"><table><thead><tr><th>Email</th><th>Họ tên</th><th>Vai trò</th><th>Bộ phận</th><th>Ngày tạo</th><th></th></tr></thead><tbody>
      ${users.map(u => `<tr data-u="${u.id}"><td>${esc(u.email)}</td><td><input class="u-name" value="${esc(u.full_name || '')}"></td>
        <td><select class="u-role">${opts(ROLES, u.role)}</select></td><td><select class="u-dept">${opts(DEPTS, u.department, '—')}</select></td>
        <td class="nowrap">${fdt(u.created_at)}</td><td><button class="btn sm primary u-save">Lưu</button></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><h3>Cài đặt</h3><div class="grid3">
      ${st.map(x => `<label>${esc(x.note || x.key)}<input data-k="${esc(x.key)}" value="${esc(x.value)}"></label>`).join('')}</div>
      <div class="toolbar"><button class="btn primary" id="st-save">Lưu cài đặt</button><button class="btn" id="st-gen">Sinh lại lịch thanh toán</button></div></div>`;
  $$('.u-save').forEach(b => b.onclick = async () => { const tr = b.closest('tr'); const role = $('.u-role', tr).value, dept = $('.u-dept', tr).value || null;
    if(role === 'bo_phan' && !dept) return toast('Tài khoản bộ phận phải chọn bộ phận.', 'error');
    try{ must(await sb.from('profiles').update({full_name:$('.u-name', tr).value, role, department: role === 'bo_phan' ? dept : null}).eq('id', tr.dataset.u)); toast('Đã lưu.'); }catch(e){ showErr(e); } });
  $('#st-save').onclick = async () => { try{ for(const i of $$('[data-k]')) must(await sb.from('app_settings').update({value:i.value.trim()}).eq('key', i.dataset.k));
    $$('[data-k]').forEach(i => settings[i.dataset.k] = isNaN(i.value) ? i.value : Number(i.value)); toast('Đã lưu cài đặt.'); }catch(e){ showErr(e); } };
  $('#st-gen').onclick = async () => { try{ const n = must(await sb.rpc('generate_schedule')); toast(`Đã sinh/cập nhật ${n} kỳ thanh toán.`); }catch(e){ showErr(e); } };
}

/* ====================== NHẬT KÝ ====================== */
const TABLES = {suppliers:'Nhà cung cấp', contract_lines:'Dòng hợp đồng', payment_requests:'Yêu cầu TT', payment_schedule:'Lịch TT', payments:'Chứng từ', payment_matches:'Đối chiếu', profiles:'Người dùng', app_settings:'Cài đặt'};
async function pageAudit(){
  const [logs, users] = await Promise.all([sb.from('audit_log').select('*').order('changed_at', {ascending:false}).limit(1000), sb.from('profiles').select('id,email,full_name')]);
  const L = must(logs), U = new Map(must(users).map(u => [u.id, u.full_name || u.email]));
  const diff = l => {
    if(l.action !== 'UPDATE') { const d = l.new_data || l.old_data || {}; return esc([d.ma_ncc, d.so_chung_tu, d.noi_dung, d.fee_period, d.amount ?? d.so_tien].filter(x => x != null).join(' · ')); }
    return Object.keys(l.new_data || {}).filter(k => !['updated_at','paid_amount','last_paid_date'].includes(k) && JSON.stringify(l.old_data?.[k]) !== JSON.stringify(l.new_data[k]))
      .map(k => `<div><b>${esc(k)}</b>: ${esc(JSON.stringify(l.old_data?.[k]))} → ${esc(JSON.stringify(l.new_data[k]))}</div>`).join('');
  };
  $('#page').innerHTML = `<div class="toolbar"><input class="grow" id="g-q" placeholder="Tìm…"><select id="g-t">${opts(TABLES, '', 'Mọi bảng')}</select><span class="muted small">1000 thay đổi gần nhất</span></div><div id="g-tbl"></div>`;
  const draw = () => { const q = $('#g-q').value, t = $('#g-t').value;
    const f = L.filter(l => (!t || l.table_name === t) && match(q, l.row_id, U.get(l.changed_by), JSON.stringify(l.new_data || l.old_data)));
    $('#g-tbl').innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Bảng</th><th>Mã dòng</th><th>Thao tác</th><th>Nội dung thay đổi</th></tr></thead><tbody>
      ${f.slice(0, 500).map(l => `<tr><td class="nowrap">${fdt(l.changed_at)}</td><td>${esc(U.get(l.changed_by) || 'Hệ thống')}</td><td>${esc(TABLES[l.table_name] || l.table_name)}</td><td>${esc(l.row_id)}</td>
        <td>${({INSERT:'Thêm', UPDATE:'Sửa', DELETE:'Xóa'})[l.action]}</td><td class="small" style="max-width:520px;word-break:break-word">${diff(l)}</td></tr>`).join('')}</tbody></table></div>`; };
  $('#g-q').oninput = debounce(draw); $('#g-t').onchange = draw; draw();
}

document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
boot();
</script>
